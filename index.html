<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Tree & Bundle Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="container">
    <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()" title="Переключить тему">
        <i class="fa-solid fa-sun"></i>
    </button>
    <header>
        <h1>🌲 File Tree Generator</h1>
        <p>GitHub / Local / ZIP &rarr; Visual Tree & Bundle</p>
    </header>

    <div class="card input-section">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('github')"><i class="fab fa-github"></i> GitHub Repo</button>
            <button class="tab-btn" onclick="switchTab('local')"><i class="fa-regular fa-folder-open"></i> Local / Zip</button>
        </div>
        <div id="github-panel" class="panel active">
            <div class="input-group">
                <input type="text" id="repoUrl" placeholder="https://github.com/username/repo">
                <input type="password" id="repoToken" placeholder="Token (опционально)">
            </div>
            <small>
                Токен нужен для приватных репо и увеличения лимитов API.
                <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--text); text-decoration: underline;">Получить токен</a>
            </small>
            <button class="action-btn" onclick="fetchGitHubRepo()">📥 Загрузить список файлов</button>
        </div>
        <div id="local-panel" class="panel">
            <div class="local-actions">
                <div class="upload-box">
                    <input type="file" id="folderInput" webkitdirectory directory multiple>
                    <div class="upload-label">
                        <i class="fa-solid fa-folder-tree"></i>
                        <span>Выбрать папку</span>
                    </div>
                </div>
                <div class="upload-box">
                    <input type="file" id="zipInput" accept=".zip">
                    <div class="upload-label">
                        <i class="fa-solid fa-file-zipper"></i>
                        <span>Выбрать ZIP</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="selection-section" class="card hidden">
        <div class="section-header">
            <h2>📂 Выберите файлы <span id="file-counter" class="counter-badge">0</span></h2>
            <div class="global-actions" style="display: flex; gap: 10px; align-items: center;">
                <button onclick="toggleAll(true)" class="small-btn">Все</button>
                <button onclick="toggleAll(false)" class="small-btn">Ничего</button>
                <div class="divider-vertical"></div>
                <!-- ДОБАВЛЕН ПЕРЕКЛЮЧАТЕЛЬ СКРЫТЫХ ФАЙЛОВ -->
                <label class="toggle-control" title="Показать скрытые системные папки (vendor, build, неизвестные форматы)">
                    <input type="checkbox" id="toggle-ignored-view" onchange="toggleIgnoredView()">
                    <span class="toggle-track" style="width: 32px; height: 18px;"><span class="toggle-indicator" style="width: 12px; height: 12px; top: 2px; left: 2px;"></span></span>
                    <span class="toggle-text" style="font-size: 11px;"><i class="fa-solid fa-eye-slash" style="font-size:10px;"></i> Скрытые</span>
                </label>
            </div>
        </div>
        <div id="extension-container" class="extension-bar hidden">
            <span class="filter-label">Типы:</span>
            <div id="extension-list" class="tags-wrapper"></div>
        </div>

        <!-- КОНТЕЙНЕР ДЕРЕВА -->
        <div id="file-list" class="file-list-container"></div>

        <button class="secondary-btn full-width-btn" style="margin-top: 15px;" onclick="generateTree()">
            <i class="fa-solid fa-eye"></i> Показать визуальное дерево
        </button>
        <div class="divider"></div>

        <div class="stats-panel">
            <div class="stats-info">
                <div class="stat-item">
                    <span class="stat-label">Всего строк</span>
                    <span id="stat-total-lines" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Код (не пустые)</span>
                    <span id="stat-code-lines" class="stat-value">0</span>
                </div>
            </div>
            <div class="stats-actions">
                <button class="secondary-btn" onclick="processFiles('stats')">
                    <i class="fa-solid fa-calculator"></i> Пересчитать размеры
                </button>
            </div>
            <div class="optimization-panel">
                <div class="opt-header">
                    <i class="fa-solid fa-sliders"></i> Оптимизация
                </div>
                <div class="opt-controls">
                    <label class="toggle-control">
                        <input type="checkbox" id="opt-remove-comments">
                        <span class="toggle-track"><span class="toggle-indicator"></span></span>
                        <span class="toggle-text"><i class="fa-regular fa-comments"></i> Без комментариев</span>
                    </label>
                    <label class="toggle-control">
                        <input type="checkbox" id="opt-remove-empty" checked>
                        <span class="toggle-track"><span class="toggle-indicator"></span></span>
                        <span class="toggle-text"><i class="fa-solid fa-align-justify"></i> Без пустых строк</span>
                    </label>
                </div>
            </div>
        </div>
        <button class="primary-btn download-btn" onclick="processFiles('download')">
            <i class="fa-solid fa-file-arrow-down"></i> Скачать всё в один файл (.txt)
        </button>
        <div id="loading-status" class="status-bar hidden">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span id="loading-text">Обработка...</span>
        </div>
    </div>

    <div id="result-section" class="card hidden">
        <div class="section-header">
            <h2>Результат</h2>
            <div class="result-controls">
                <select id="view-mode" onchange="renderCurrentView()" class="mode-select">
                    <option value="vertical">Visual Tree (со статистикой)</option>
                    <option value="ascii">ASCII (для Readme)</option>
                </select>
                <button onclick="copyToClipboard()" class="small-btn"><i class="fa-regular fa-copy"></i> Copy</button>
            </div>
        </div>
        <div id="tree-output-container" class="output-container"></div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
